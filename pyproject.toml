[project]
name = "slm"
version = "0.1.0"
description = "Building a small language model from scratch"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[project.scripts]
slm = "slm:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
